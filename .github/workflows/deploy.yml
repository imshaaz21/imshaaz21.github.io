name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Fired by imshaaz21/cv on push to its main branch
  repository_dispatch:
    types: [cv-updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site with Vite
        run: npm run build

      # CV PDF is built from the private imshaaz21/cv repo (main branch), not committed here.
      # CV_TOKEN: fine-grained PAT with Contents read on imshaaz21/cv.
      - name: Checkout CV repo
        uses: actions/checkout@v4
        with:
          repository: imshaaz21/cv
          ref: main
          token: ${{ secrets.CV_TOKEN }}
          path: cv

      - name: Build CV
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: cv

      - name: Add CV to site
        run: cp cv/main.pdf dist/Shanaaz-Ahamed-CV.pdf

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
